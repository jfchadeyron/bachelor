<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 345" width="680" height="345" font-family="Arial, 'Liberation Sans', 'DejaVu Sans', sans-serif" role="img">
<title>Rebondir par le bastion : un tuyau chiffré dans un autre</title>
<defs>
<g id="cle"><circle cx="14" cy="14" r="13"/><rect x="24" y="10" width="42" height="8" rx="2"/><rect x="50" y="18" width="6" height="8"/><rect x="59" y="18" width="6" height="11"/><circle cx="14" cy="14" r="5" fill="#ffffff"/></g>
<marker id="fl" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#4a5563" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
</defs>
<!-- colonnes des trois machines -->
<g stroke="#d3d9e0" stroke-width="1.2" stroke-dasharray="4 4">
<line x1="90" y1="100" x2="90" y2="212"/>
<line x1="340" y1="100" x2="340" y2="212"/>
<line x1="590" y1="100" x2="590" y2="212"/>
</g>
<!-- les machines -->
<g fill="#f5f6f8" stroke="#d3d9e0">
<rect x="15" y="30" width="150" height="70" rx="8"/>
<rect x="265" y="30" width="150" height="70" rx="8"/>
<rect x="515" y="30" width="150" height="70" rx="8"/>
</g>
<g font-size="15" font-weight="bold" fill="#1f3a5f" text-anchor="middle">
<text x="90" y="60">Votre PC</text>
<text x="340" y="60">BST-LNX-01</text>
<text x="590" y="60">SRV-LNX-01</text>
</g>
<g font-size="12" fill="#4a5563" text-anchor="middle">
<text x="90" y="80">en Wi-Fi</text>
<text x="340" y="80">bastion · deux cartes</text>
<text x="590" y="80">serveur · 10.10.10.20</text>
</g>
<!-- le chemin réseau -->
<line x1="167" y1="65" x2="261" y2="65" stroke="#4a5563" stroke-width="1.3" marker-end="url(#fl)"/>
<line x1="417" y1="65" x2="511" y2="65" stroke="#4a5563" stroke-width="1.3" marker-end="url(#fl)"/>
<g font-size="11" fill="#1d2530" text-anchor="middle">
<text x="215" y="56" font-size="10.5" font-family="'DejaVu Sans Mono', Consolas, monospace">pont · port 22</text>
<text x="215" y="81" fill="#4a5563">partage</text>
    <text x="215" y="93" fill="#4a5563">de connexion</text>
<text x="465" y="56" font-size="10.5" font-family="'DejaVu Sans Mono', Consolas, monospace">10.10.10.20:22</text>
<text x="465" y="81" fill="#4a5563">réseau</text>
    <text x="465" y="93" fill="#4a5563">du lab</text>
</g>
<!-- tuyau 1 : PC - bastion -->
<rect x="62" y="122" width="306" height="64" rx="32" fill="#e8eef6" stroke="#1f3a5f" stroke-width="1.2"/>
<text x="215" y="141" text-anchor="middle" font-size="12" font-weight="bold" fill="#1f3a5f">tuyau 1 : PC ↔ bastion</text>
<!-- tuyau 2 : PC - SRV-LNX-01, glissé dans le tuyau 1 -->
<rect x="76" y="150" width="528" height="26" rx="13" fill="#ffffff" stroke="#1f3a5f" stroke-width="1.6"/>
<text x="465" y="168" text-anchor="middle" font-size="12" font-weight="bold" fill="#1f3a5f">tuyau 2 : PC ↔ SRV-LNX-01</text>
<text x="215" y="168" text-anchor="middle" font-size="11" fill="#4a5563">(glissé dans le tuyau 1)</text>
<!-- où se trouve votre clé -->
<use href="#cle" transform="translate(67 214) scale(0.7)" fill="#c07a0c"/>
<use href="#cle" transform="translate(317 214) scale(0.7)" fill="#2d6a3e"/>
<use href="#cle" transform="translate(567 214) scale(0.7)" fill="#2d6a3e"/>
<g font-size="13" font-weight="bold" text-anchor="middle">
<text x="90" y="252" fill="#8f5400">Clé privée</text>
<text x="340" y="252" fill="#2d6a3e">Clé publique</text>
<text x="590" y="252" fill="#2d6a3e">Clé publique</text>
</g>
<g font-size="12" fill="#1d2530" text-anchor="middle">
<text x="90" y="269">la vôtre, elle reste ici</text>
<text x="340" y="269">la vôtre : 1re vérification</text>
<text x="590" y="269">la vôtre : 2e vérification</text>
</g>
<g font-size="11" fill="#4a5563" text-anchor="middle" font-family="'DejaVu Sans Mono', Consolas, monospace">
<text x="90" y="286">~/.ssh/id_ed25519</text>
<text x="340" y="286">~/.ssh/authorized_keys</text>
<text x="590" y="286">~/.ssh/authorized_keys</text>
</g>
<text x="340" y="326" text-anchor="middle" font-size="14" font-weight="bold" fill="#1f3a5f">Le bastion fait passer le tuyau 2 sans pouvoir l'ouvrir.</text>
</svg>
