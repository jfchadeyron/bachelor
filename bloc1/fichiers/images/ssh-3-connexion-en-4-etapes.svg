<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 430" width="680" height="430" font-family="Arial, 'Liberation Sans', 'DejaVu Sans', sans-serif" role="img">
<title>Une connexion SSH en quatre étapes</title>
<defs>
<g id="cle"><circle cx="14" cy="14" r="13"/><rect x="24" y="10" width="42" height="8" rx="2"/><rect x="50" y="18" width="6" height="8"/><rect x="59" y="18" width="6" height="11"/><circle cx="14" cy="14" r="5" fill="#ffffff"/></g>
<marker id="fl" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
<marker id="fl1" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#4a5563" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
<marker id="fl2" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#1f3a5f" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
</defs>
<g font-size="14" font-weight="bold" fill="#1f3a5f">
<text x="15" y="56">1. Le serveur</text>
<text x="15" y="156">2. Le tuyau chiffré</text>
<text x="15" y="256">3. Vous prouvez</text>
<text x="15" y="371">4. Vous</text>
</g>
<g font-size="12" fill="#4a5563">
<text x="15" y="74">prouve qui il est</text>
<text x="15" y="174">se met en place</text>
<text x="15" y="274">qui vous êtes</text>
<text x="15" y="389">travaillez</text>
</g>
<g fill="#f5f6f8" stroke="#9aa5b4">
<rect x="175" y="40" width="100" height="40" rx="6"/><rect x="535" y="40" width="115" height="40" rx="6"/>
<rect x="175" y="140" width="100" height="40" rx="6"/><rect x="535" y="140" width="115" height="40" rx="6"/>
<rect x="175" y="240" width="100" height="40" rx="6"/><rect x="535" y="240" width="115" height="40" rx="6"/>
<rect x="175" y="355" width="100" height="40" rx="6"/><rect x="535" y="355" width="115" height="40" rx="6"/>
</g>
<g font-size="13" fill="#1d2530" text-anchor="middle">
<text x="225" y="65">Votre PC</text><text x="592" y="65">Serveur</text>
<text x="225" y="165">Votre PC</text><text x="592" y="165">Serveur</text>
<text x="225" y="265">Votre PC</text><text x="592" y="265">Serveur</text>
<text x="225" y="380">Votre PC</text><text x="592" y="380">Serveur</text>
</g>
<use href="#cle" x="372" y="14" fill="#c07a0c"/>
<line x1="531" y1="56" x2="281" y2="56" stroke="#4a5563" stroke-width="1.3" marker-end="url(#fl1)"/>
<g font-size="12" fill="#1d2530" text-anchor="middle">
<text x="405" y="76">il signe avec sa clé privée</text>
<text x="405" y="94">votre PC vérifie avec known_hosts</text>
</g>
<use href="#cle" x="285" y="114" fill="#1f3a5f"/>
<use href="#cle" x="458" y="114" fill="#1f3a5f"/>
<rect x="279" y="150" width="252" height="22" rx="11" fill="#e8eef6" stroke="#1f3a5f"/>
<text x="405" y="165" text-anchor="middle" font-size="12" font-weight="bold" fill="#1f3a5f">tuyau chiffré</text>
<g font-size="12" fill="#1d2530" text-anchor="middle">
<text x="405" y="192">la même clé de session des deux côtés,</text>
<text x="405" y="208">calculée sans être envoyée</text>
</g>
<use href="#cle" x="372" y="214" fill="#c07a0c"/>
<rect x="279" y="250" width="252" height="22" rx="11" fill="#e8eef6" stroke="#1f3a5f"/>
<line x1="289" y1="261" x2="521" y2="261" stroke="#1f3a5f" stroke-width="1.3" marker-end="url(#fl2)"/>
<g font-size="12" fill="#1d2530" text-anchor="middle">
<text x="405" y="292">vous signez avec votre clé privée</text>
<text x="405" y="308">(ou vous donnez votre mot de passe)</text>
<text x="405" y="324">le serveur vérifie (authorized_keys)</text>
</g>
<rect x="279" y="364" width="252" height="22" rx="11" fill="#e8eef6" stroke="#1f3a5f"/>
<text x="405" y="379" text-anchor="middle" font-size="12" font-weight="bold" fill="#1f3a5f">commandes, fichiers</text>
<text x="405" y="408" text-anchor="middle" font-size="12" fill="#1d2530">tout passe dans le tuyau chiffré</text>
</svg>
