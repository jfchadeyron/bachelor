<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 335" width="680" height="335" font-family="Arial, 'Liberation Sans', 'DejaVu Sans', sans-serif" role="img">
<title>Qui possède quelle clé dans une connexion SSH</title>
<defs>
<g id="cle"><circle cx="14" cy="14" r="13"/><rect x="24" y="10" width="42" height="8" rx="2"/><rect x="50" y="18" width="6" height="8"/><rect x="59" y="18" width="6" height="11"/><circle cx="14" cy="14" r="5" fill="#ffffff"/></g>
<marker id="fl" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#4a5563" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
</defs>
<text x="340" y="24" text-anchor="middle" font-size="12" fill="#4a5563">la clé publique du serveur est enregistrée sur votre PC à la première connexion</text>
<path d="M430 72 L430 38 L250 38 L250 70" fill="none" stroke="#4a5563" stroke-width="1.2" marker-end="url(#fl)"/>
<rect x="15" y="72" width="315" height="170" rx="10" fill="#f5f6f8" stroke="#d3d9e0"/>
<text x="172" y="98" text-anchor="middle" font-size="15" font-weight="bold" fill="#1f3a5f">Votre PC (client)</text>
<use href="#cle" x="62" y="114" fill="#c07a0c"/>
<text x="95" y="168" text-anchor="middle" font-size="14" font-weight="bold" fill="#8f5400">Clé privée</text>
<text x="95" y="186" text-anchor="middle" font-size="13" fill="#1d2530">la vôtre</text>
<text x="95" y="206" text-anchor="middle" font-size="11" font-family="'DejaVu Sans Mono', Consolas, monospace" fill="#4a5563">~/.ssh/id_ed25519</text>
<use href="#cle" x="217" y="114" fill="#2d6a3e"/>
<text x="250" y="168" text-anchor="middle" font-size="14" font-weight="bold" fill="#2d6a3e">Clé publique</text>
<text x="250" y="186" text-anchor="middle" font-size="13" fill="#1d2530">du serveur</text>
<text x="250" y="206" text-anchor="middle" font-size="11" font-family="'DejaVu Sans Mono', Consolas, monospace" fill="#4a5563">~/.ssh/known_hosts</text>
<rect x="350" y="72" width="315" height="170" rx="10" fill="#f5f6f8" stroke="#d3d9e0"/>
<text x="507" y="98" text-anchor="middle" font-size="15" font-weight="bold" fill="#1f3a5f">Le serveur SRV-LNX-01</text>
<use href="#cle" x="397" y="114" fill="#c07a0c"/>
<text x="430" y="168" text-anchor="middle" font-size="14" font-weight="bold" fill="#8f5400">Clé privée</text>
<text x="430" y="186" text-anchor="middle" font-size="13" fill="#1d2530">du serveur</text>
<text x="430" y="206" text-anchor="middle" font-size="11" font-family="'DejaVu Sans Mono', Consolas, monospace" fill="#4a5563">ssh_host_ed25519_key</text>
<use href="#cle" x="547" y="114" fill="#2d6a3e"/>
<text x="580" y="168" text-anchor="middle" font-size="14" font-weight="bold" fill="#2d6a3e">Clé publique</text>
<text x="580" y="186" text-anchor="middle" font-size="13" fill="#1d2530">la vôtre</text>
<text x="580" y="206" text-anchor="middle" font-size="11" font-family="'DejaVu Sans Mono', Consolas, monospace" fill="#4a5563">~/.ssh/authorized_keys</text>
<path d="M95 242 L95 264 L580 264 L580 244" fill="none" stroke="#4a5563" stroke-width="1.2" marker-end="url(#fl)"/>
<text x="340" y="284" text-anchor="middle" font-size="12" fill="#4a5563">votre clé publique est copiée sur le serveur (ssh-copy-id)</text>
<text x="340" y="318" text-anchor="middle" font-size="14" font-weight="bold" fill="#1f3a5f">Chacun garde sa clé privée et possède la clé publique de l'autre.</text>
</svg>
